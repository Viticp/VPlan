spring:
  datasource:
    # H2 en memoria, imitando a MySQL. Solo se usa en los tests.
    url: "jdbc:h2:mem:vplan;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.vplan: WARN
    org.flywaydb: WARN
